<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الهوية الآمنة - Safe Identity</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة توليد QR Code أوتوماتيكياً -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-blue: #0A2540;
            --primary-green: #388E3C;
            --light-bg: #f4f7f6;
            --box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-banner {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .hero-banner h2 {
            font-size: 32px;
            font-weight: 900;
            margin: 0 0 10px 0;
        }

        .hero-banner p {
            font-size: 16px;
            margin: 0;
            color: #d1d9e0;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .main-container {
            max-width: 900px;
            width: 90%;
            margin: 0 auto 40px auto;
            text-align: center;
        }

        .logo-area {
            background-color: white;
            padding: 30px 20px;
            border-radius: 0 0 20px 20px;
            box-shadow: var(--box-shadow);
            margin-bottom: 40px;
            border-bottom: 4px solid var(--primary-green);
        }

        .logo-image-container {
            max-width: 350px;
            margin: 0 auto;
        }
        
        .logo-image-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .values-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .value-box {
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px 10px;
            box-shadow: var(--box-shadow);
            transition: transform 0.3s;
        }

        .value-box:hover {
            transform: translateY(-5px);
            border-color: var(--primary-green);
        }

        .value-box i {
            font-size: 30px;
            color: var(--primary-green);
            margin-bottom: 10px;
        }

        .value-box h3 {
            margin: 0;
            font-size: 18px;
            color: var(--primary-blue);
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            border: none;
            color: white;
            box-shadow: var(--box-shadow);
            transition: opacity 0.3s;
            width: 250px;
            text-decoration: none;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .btn-private {
            background-color: var(--primary-blue);
        }

        .btn-public {
            background-color: var(--primary-green);
        }

        .footer-card {
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: right;
            box-shadow: var(--box-shadow);
            flex-wrap: wrap;
            gap: 20px;
            border-right: 5px solid var(--primary-green);
        }

        .footer-info p {
            margin: 8px 0;
            font-size: 15px;
            color: #444;
        }

        .footer-info p i {
            color: var(--primary-green);
            width: 25px;
            text-align: center;
        }

        /* حاوية الـ QR Code المتولّد أوتوماتيكياً */
        #qrcode-container {
            background-color: white;
            padding: 5px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 600px) {
            .footer-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="hero-banner">
        <h2>نحو مجتمع أكثر أماناً</h2>
        <p>مبادرة اجتماعية مبتكرة لتعزيز سلامة الفئات الأكثر عرضة للضياع أو صعوبة التعرف على هويتهم.</p>
    </div>

    <div class="main-container">
        
        <div class="logo-area">
            <div class="logo-image-container">
                <img src="logo.jpg" alt="لوغو الهوية الآمنة">
            </div>
        </div>

        <div class="values-grid">
            <div class="value-box">
                <i class="fas fa-hand-holding-heart"></i>
                <h3>إنسانية</h3>
            </div>
            <div class="value-box">
                <i class="fas fa-user-shield"></i>
                <h3>كرامة</h3>
            </div>
            <div class="value-box">
                <i class="fas fa-lock"></i>
                <h3>أمان</h3>
            </div>
            <div class="value-box">
                <i class="fas fa-shield-virus"></i>
                <h3>حماية</h3>
            </div>
        </div>

        <div class="action-buttons">
            <a href="kids.html" class="action-btn btn-private">
                <i class="fas fa-lock"></i>
                سجل الأطفال (خاص)
            </a>
            <a href="guide.html" class="action-btn btn-public">
                <i class="fas fa-book-open"></i>
                الدروس والشروحات
            </a>
        </div>

        <!-- البطاقة السفلية مع توليد الكود بار أوتوماتيكياً -->
        <div class="footer-card">
            <div class="footer-info">
                <p><i class="fas fa-user"></i> إعداد: صليحة قطو (أخصائية نفسانية)</p>
                <p><i class="fas fa-envelope"></i> saliha.alhawia@gmail.com</p>
                <p><i class="fas fa-map-marker-alt"></i> بسكرة - الجزائر</p>
                <p><i class="fas fa-globe"></i> alhawia-amna.com</p>
            </div>
            
            <div id="qrcode-container"></div>
        </div>

    </div>

    <script>
        new QRCode(document.getElementById("qrcode-container"), {
            text: "https://alhawia-amna.com", /* بدلها برابط موقعك الحقيقي لاحقاً */
            width: 90,
            height: 90,
            colorDark: "#0A2540",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>

</body>
</html>
