<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الأطفال - الهوية الآمنة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0A2540;
            --primary-green: #388E3C;
            --light-bg: #f4f7f6;
            --box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .top-bar h2 {
            margin: 0;
            font-size: 22px;
        }

        .back-btn {
            background-color: var(--primary-green);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--box-shadow);
            transition: opacity 0.3s;
        }

        .back-btn:hover {
            opacity: 0.9;
        }

        .main-container {
            max-width: 900px;
            width: 90%;
            margin: 40px auto;
        }

        .content-section {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: var(--box-shadow);
            text-align: right;
            border-right: 5px solid var(--primary-blue);
            display: none; /* مخفية حتى يتم إدخال كلمة السر الصحيحة */
        }

        .content-section h2 {
            color: var(--primary-blue);
            font-size: 26px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .content-section p {
            color: #555;
            font-size: 16px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h2>الهوية الآمنة - سجل الأطفال</h2>
        <a href="index.html" class="back-btn">
            <i class="fas fa-home"></i> العودة للصفحة الرئيسية
        </a>
    </div>

    <div class="main-container">
        <!-- محتوى الصفحة (يظهر فقط بعد كتابة الكود الصحيح) -->
        <div class="content-section" id="protected-content">
            <h2>سجل الأطفال المستفيدين (قسم خاص)</h2>
            <p>هذه الصفحة مخصصة لعرض وإدارة سجل الأطفال المسجلين في مبادرة "الهوية الآمنة".</p>
            <p>يمكنك لاحقاً إضافة الجداول، النماذج الخاصة بتسجيل بيانات الأطفال، أو أي معلومات سرية وخاصة بالأسرة والمؤسسة هنا.</p>
        </div>
    </div>

    <!-- كود الجافاسكريبت لطلب كلمة السر أول ما تفتح الصفحة -->
    <script>
        // كلمة السر الافتراضية هي 1234، تقدر تبدلها بأي رقم أو كلمة تحبها بين القوسين
        let password = prompt("هذه الصفحة محمية. يرجى إدخال كلمة السر:");
        
        if (password === "0qbi281998") {
            // إذا كانت كلمة السر صحيحة، نظهر المحتوى
            document.getElementById("protected-content").style.display = "block";
        } else {
            // إذا كانت خطأ أو ضغط إلغاء، نرجعوه للصفحة الرئيسية
            alert("كلمة السر غير صحيحة!");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
